# Storage overlay for COS applications
#
# IMPORTANT NOTE: the sum of these must be <= 0.8 * ceph capacity in the k8s vms.
#
# We have 3 k8s VMs, each with a disk for ceph.
# Ceph is running in 3x replication, one disk per k8s VM,
# so we have effectively the storage capacity of one of those disks.
#
# Ceph also is not recommended to be at more than 80% capacity.
#
# Eg.
# alertmanager + grafana + loki + prometheus <= 0.8 * ceph capacity
# 20G + 20G + 450G + 450G <= 0.8 * 1000G
# 940 <= 800G
#
# Please adjust the following values according to the disk size
applications:
  alertmanager:
    storage:
      # The Alertmanager operator uses the `database` storage to
      # store nflog and silence snapshots.
      # See the `--storage.path` argument of Alertmanager
      data: 2G
  grafana:
    storage:
      # The Grafana operator uses the `database` storage to store
      # configurations, plugins, user data, etc. That is, everything
      # that is normally stored under /var/lib/grafana.
      database: 2G
  loki:
    storage:
      # This is the volume used by loki for the index of boltdb-shipper.
      # See https://grafana.com/docs/loki/latest/configuration/examples/
      active-index-directory: 2G
      # Loki will store in this volume the chunks, which contain the
      # actual log content.
      # See https://grafana.com/docs/loki/latest/operations/storage/
      # The storage must be pretty large, as this is for storing all the logs for as long as required (eg. 1 month).
      # TODO: link to COS and/or Bootstack team recommendation
      loki-chunks: 5G
  prometheus:
    storage:
      # Prometheus operator uses the `database` storage to store TSDB data.
      # See the `--storage.tsdb.path` argument of Prometheus.
      # This storage must be large, as this is for storing metrics for as long as required (eg. 1 month).
      # TODO: link to COS and/or Bootstack team recommendation
      database: 5G
